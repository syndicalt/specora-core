[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specora-core"
version = "0.2.0"
description = "Domain-agnostic Contract-Driven Development engine — builds applications from declarative specifications"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicholas Blanchard" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "deepdiff>=7.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/syndicalt/specora-core"
Repository = "https://github.com/syndicalt/specora-core"
Issues = "https://github.com/syndicalt/specora-core/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.25",
    "httpx>=0.27",
    "pyjwt>=2.8",
]
healer = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
all = [
    "specora-core[dev,llm,healer]",
]

[project.scripts]
specora-core = "forge.cli.main:cli"
spc = "forge.cli.main:cli"
specora-init = "forge.cli.init_project:init_project"

[tool.setuptools.packages.find]
include = ["forge*", "factory*", "engine*", "healer*", "extractor*", "spec*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.meta.yaml", "*.contract.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Every family below is at zero across the repository. A rule is only added
# here once the codebase already satisfies it — enabling a rule and then
# ignoring it repo-wide buys nothing.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings — catches invalid escapes in the template strings
    "F",     # pyflakes
    "I",     # import order
    "C4",    # comprehension misuse
    "DTZ",   # naive datetimes: this engine emits created_at/updated_at
    "ASYNC", # blocking calls in async defs — the generated repositories are async
    "G",     # logging call misuse
    "LOG",   # logging module misuse
    "N",     # pep8 naming
    "RSE",   # raise with unnecessary parentheses
    "YTT",   # sys.version comparisons
    "B",     # bugbear — B904 exception chaining matters here, see below
    "S",     # bandit security rules, minus the nine listed under `ignore`
]

# The nine bandit rules below are switched off individually rather than by
# dropping the whole `S` family. That keeps 98 of bandit's 107 rules live —
# weak hashes (S324), disabled certificate verification (S501), `yaml.load`
# (S506), `pickle` (S301), bind-all-interfaces (S104) — instead of the zero a
# blanket exclusion would leave. Each exclusion below is a false positive for
# this codebase, verified rather than assumed, and named so a future reader can
# re-test the claim instead of trusting the list.
ignore = [
    # `assert` is what a pytest suite is made of. 809 of the 847 S hits.
    "S101",
    # S105/S106 match on the *identifier*, not the value. Every hit is a
    # constant naming an environment variable or a contract field —
    # INGEST_TOKEN_ENV, PLACEHOLDER_SECRET, _DEFAULT_PASSWORD_FIELD. No secret
    # is hardcoded anywhere; the app refuses to boot on a placeholder secret.
    "S105",
    "S106",
    # A literal "/tmp/x" inside a test's assertion string.
    "S108",
    # One hit: retry backoff jitter in engine/retry.py, so concurrent healer
    # tickets do not wake on the same tick. Spreading retries is not a
    # cryptographic use and `secrets` would be the wrong tool.
    "S311",
    # forge/cli/repl.py's `/shell` escape hatch. `shell=True` survives there
    # deliberately and only for text the user typed at the prompt: cmd_shell
    # raises RuntimeError unless called with typed_by_user=True, and the
    # LLM-routing path dispatches through an allowlist that never builds a
    # command string. os.system is the constant "cls"/"clear". Editor launch is
    # an argv list via shlex.split, never a shell.
    "S602",
    "S603",
    "S605",
    # Generated SQL. Identifiers are compile-time constants routed through
    # naming.sql_ident (which always quotes); values are always $n placeholders.
    # That is the safe construction, and it is what these rules cannot see.
    "S608",
]

# Not enabled, and why:
#   UP (pyupgrade) — 93 hits, almost all UP045 (`Optional[X]` -> `X | None`).
#      Mechanical and auto-fixable, but it would rewrite generated-code
#      templates whose output is pinned by tests; worth a dedicated pass.
